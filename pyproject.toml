[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-evidence-pack"
version = "0.1.0"
description = "Read-only aggregator that turns evaluation artifacts from five independent tools into a signed, independently verifiable release decision pack whose verdict can be recomputed from its own evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mateusz Sliwinski" }]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.scripts]
revpack = "revpack.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/revpack"]
