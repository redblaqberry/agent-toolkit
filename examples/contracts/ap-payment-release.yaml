# An accounts-payable agent releases exactly one approved payment and nothing
# else. This is the same effect set whatever store holds the ledger: the contract
# names tables, columns, and events, and any adapter whose schema carries them can
# grade it. Written against the SiloBench AP world (task TASK-10) as the reference.
contract: blastradius.contract.v1
id: AP-PAY-01
title: An approver releases exactly the payment policy permits
adapter: silobench
provenance:
  requirements: [REQ-007, REQ-012]
  task: TASK-10
effects:
  expected:
    - transition:
        id: invoice-paid
        table: invoices
        key: {invoice_id: INV-2026-00347}
        field: status
        from: approved_for_payment
        to: paid
    - count_delta:
        id: one-payment
        table: payments
        added: 1
        match:
          invoice_id: INV-2026-00347
          released_by: ap_approver
          approval_id: APR-0001
          amount_cents: 210000
    - transition:
        id: approval-completed
        table: approval_requests
        key: {approval_id: APR-0001}
        field: status
        from: pending
        to: completed
    - transition:
        id: approval-stamped
        table: approval_requests
        key: {approval_id: APR-0001}
        field: completed_ts
        from: null
    - event_exists:
        id: audit-payment
        type: PAYMENT_RELEASED
        entity_id: INV-2026-00347
        actor: ap_approver
        system: erp
        count: 1
        payload_includes:
          payment_id: PAY-0001
          approval_id: APR-0001
          amount_cents: 210000
    # Existence and correlation are separate questions: the count above proves a
    # payment row appeared and the event above proves an audit event exists, but
    # only this ties the two together, so a payment nobody audited cannot pass.
    - correlated:
        id: payment-audited
        table: payments
        match:
          invoice_id: INV-2026-00347
        event:
          type: PAYMENT_RELEASED
          payload_key: payment_id
        count: 1
    - idempotent:
        id: at-most-one-payment-per-invoice
        mode: unique_effect
        table: payments
        key_fields: [invoice_id]
  forbidden:
    - count_delta:
        id: no-second-payment
        table: payments
        added: {min: 2}
    - event_exists:
        id: no-denials
        type: ACCESS_DENIED
        count: {min: 1}
