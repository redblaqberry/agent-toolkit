# The order ships, and nothing else in the store moves. Adapter-neutral: any
# capture whose schema has an `orders` table with a `status` column and an
# `ORDER_SHIPPED` event can be graded by this. Used by the quickstart, which
# grades it against the committed JSON snapshots with the generic adapter.
contract: blastradius.contract.v1
id: ORD-SHIP-01
title: The order ships, and nothing else moves
effects:
  expected:
    - transition:
        id: order-shipped
        table: orders
        key: {order_id: O-1}
        field: status
        from: placed
        to: shipped
    - event_exists:
        id: ship-audited
        type: ORDER_SHIPPED
        entity_id: O-1
        count: 1
